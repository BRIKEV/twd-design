# Render Blueprint: runs the published image, so there is nothing to build or fork.
# Socket Mode (SLACK_APP_TOKEN set) needs no public URL; Render still uses /healthz to check the service.
# Render's free web services sleep when idle, which would disconnect the bot: the starter plan (512 MB) is
# the smallest that stays on. See https://design.twd.dev/docs/install/render
services:
  - type: web
    name: twd-design
    runtime: image
    image:
      url: ghcr.io/brikev/twd-design:0.4   # 0.4.x patches on every redeploy
    plan: starter
    healthCheckPath: /healthz
    envVars:
      # Render asks for these when you create the service: copy them from the .env that
      # `npm run setup` wrote. Any other variable (another provider's key, LOG_LEVEL...) goes in
      # Environment → Add from .env afterwards.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: MODEL
        value: zai/glm-5.3-flash
      - key: ZHIPU_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
